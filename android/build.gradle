buildscript {
    ext.kotlin_version = '2.2.20'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

// Relax Java compile flags in plugin modules to avoid failing on warnings
subprojects { Project subproject ->
    tasks.withType(JavaCompile).configureEach { JavaCompile jc ->
        if (jc.options != null && jc.options.compilerArgs != null) {
            jc.options.compilerArgs.removeAll(['-Werror'])
        }
        // Ensure Java 17 toolchain compatibility
        if (subproject.hasProperty('android')) {
            try {
                subproject.android.compileOptions.sourceCompatibility = JavaVersion.VERSION_17
                subproject.android.compileOptions.targetCompatibility = JavaVersion.VERSION_17
            } catch (ignored) {
            }
        }
    }
}

// Ensure namespaces for older plugins under AGP 8+
subprojects { Project subproject ->
    if (subproject.name == 'webview_cookie_manager') {
        subproject.plugins.withId('com.android.library') {
            def androidExt = subproject.extensions.findByName('android')
            if (androidExt != null && (!androidExt.hasProperty('namespace') || androidExt.namespace == null)) {
                androidExt.namespace = 'io.flutter.plugins.webview_cookie_manager'
            }
        }
    }
    if (subproject.name == 'flutter_local_notifications') {
        subproject.plugins.withId('com.android.library') {
            def androidExt = subproject.extensions.findByName('android')
            if (androidExt != null && (!androidExt.hasProperty('namespace') || androidExt.namespace == null)) {
                androidExt.namespace = 'com.dexterous.flutterlocalnotifications'
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
